[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agilent-8164b"
version = "0.1.0"
description = "Python driver for the Keysight/Agilent 8164B Lightwave Measurement System"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "pyvisa>=1.11",
]

[project.optional-dependencies]
examples = [
    "matplotlib",
]
gui = [
    "PyQt6>=6.4",
    "pyqtgraph>=0.13",
]
dev = [
    "pytest",
    "pytest-qt",
    "PyQt6>=6.4",
    "pyqtgraph>=0.13",
]

[project.scripts]
agilent-8164b-gui = "agilent_8164b.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-v"
